[package]
name = "AceForge"
version = "0.6.9"
description = "Local ACE-Step music generation"
authors = ["ghost"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "aceforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# minimp3 is a single-header C decoder. It has to be compiled by a C compiler,
# which is what cc is for; a Rust include! cannot parse its preprocessor.
cc = "1"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
ureq = { version = "2", features = ["json"] }
dirs = "5"
tauri-plugin-dialog = "2"

[dev-dependencies]
ureq = { version = "2", features = ["json"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
strip = true
